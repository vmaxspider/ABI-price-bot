name: ABI Price Bot

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes
  workflow_dispatch:          # permet de lancer manuellement depuis GitHub

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installe les dépendances
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Lance le bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_WEEKLY_URL: ${{ secrets.DISCORD_WEBHOOK_WEEKLY_URL }}
        run: python bot.py

      - name: Sauvegarde les prix dans le repo
        run: |
          git config user.name "abi-bot"
          git config user.email "abi-bot@users.noreply.github.com"
          git add price_history.json
          [ -f weekly_anchor.json ] && git add weekly_anchor.json || true
          [ -f weekly_state.json ] && git add weekly_state.json || true
          git diff --quiet --cached || git commit -m "update price history"
          git push
